<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<!-- WhatsApp link card. Made with ~/.claude/tools/share-card --navy &quot;Lag BaOmer&quot; --green &quot;Interactive Story&quot; -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@800&family=Lora:ital,wght@1,600&family=Frank+Ruhl+Libre:wght@500;700&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;width:1200px;height:630px;overflow:hidden;background:#fff}
  .bar{position:absolute;top:0;left:0;right:0;height:12px;background:linear-gradient(90deg,#343e85 0%,#10653c 55%,#b88a3a 100%)}
  .bsd{position:absolute;top:30px;right:40px;font:500 22px 'Frank Ruhl Libre',serif;color:#474b63}
  .wrap{position:absolute;inset:12px 0 0 0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:34px}
  .logo{height:262px;display:block}
  .name{max-width:1080px;text-align:center;line-height:1.08;font-size:92px;color:#343e85;font-family:Montserrat,sans-serif;font-weight:800;letter-spacing:-.5px}
  .name em{font-family:Lora,serif;font-style:italic;font-weight:600;color:#10653c;letter-spacing:0}
  .name[dir=rtl]{font-family:'Frank Ruhl Libre',serif;font-weight:700;letter-spacing:0}
</style></head>
<body>
<div class="bar"></div>
<div class="bsd" dir="rtl">בס"ד</div>
<div class="wrap">
  <img class="logo" src="https://pardesdayschool.org/assets/images/logos/merged-logo-transparent.png" alt="">
  <div class="name">Lag BaOmer <em>Interactive Story</em></div>
</div>
<script>
  // Shrink the name until it fits on one line, down to 60px; past that it wraps to two.
  document.fonts.ready.then(function () {
    var n = document.querySelector('.name'), size = 92;
    while (size > 60 && n.scrollWidth > 1080 || size > 60 && n.getClientRects().length && n.offsetHeight > size * 1.3) {
      size -= 2; n.style.fontSize = size + 'px';
    }
  });
</script>
</body></html>
